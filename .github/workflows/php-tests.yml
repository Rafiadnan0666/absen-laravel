# .github/workflows/php-tests.yml
# Updated workflow
name: PHP Tests

on:
  push:
    branches: [ main, interface/neurobrutalism ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: abs
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, ctype, fileinfo, tokenizer, dom, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install -n --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Set up MySQL database and run migrations
        run: |
          php artisan migrate:fresh --force

      - name: Run tests
        run: php -d memory_limit=512M artisan test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: abs
          DB_USERNAME: root
          DB_PASSWORD: secret
