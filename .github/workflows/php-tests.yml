# .github/workflows/php-tests.yml

name: PHP Tests

on:
  push:
    branches: [ main, interface/neurobrutalism ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: abs
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, mbstring, ctype, fileinfo, tokenizer, dom, json
          coverage: none

      - name: Install Composer dependencies
        run: composer install -n --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Set up MySQL database
        run: |
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/0000_0000_000000_create_users_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/0001_01_01_000000_create_cache_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/0001_01_01_000001_create_jobs_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_departments_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_job_titles_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_permissions_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_roles_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_shifts_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_locations_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_attendance_logs_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_attendances_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_holidays_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_leaves_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_payrolls_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_overtime_rules_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_salary_rules_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_payroll_details_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_announcements_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_reimbursements_table.php
          mysql -h 127.0.0.1 -u root -psecret abs < database/migrations/2026_05_01_113443_create_face_logs_table.php

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --memory=256
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: abs
          DB_USERNAME: root
          DB_PASSWORD: secret
